[package]
name = "librqbit-dht"
version.workspace = true
edition = "2024"
description = "DHT implementation, used in rqbit torrent client."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-dht"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

[features]
default = ["sha1-crypto-hash"]
sha1-crypto-hash = ["sha1w/sha1-crypto-hash"]
sha1-ring = ["sha1w/sha1-ring"]

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_derive.workspace = true
leaky-bucket.workspace = true
serde_json.workspace = true
buffers.workspace = true
bencode.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tracing.workspace = true
backon = { workspace = true, features = ["tokio-sleep"] }
futures.workspace = true
rand.workspace = true
indexmap.workspace = true
dashmap = { workspace = true, features = ["serde"] }
clone_to_owned.workspace = true
librqbit-core.workspace = true
chrono = { workspace = true, features = ["serde"] }
tokio-util.workspace = true
bytes.workspace = true
librqbit-dualstack-sockets.workspace = true
thiserror.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
sha1w.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
tempfile.workspace = true
# The fake SOCKS5 / SOCKS4 / HTTP proxies for the DHT proxy tests.
librqbit-core = { workspace = true, features = ["test-util"] }
# Only to sign with the expanded private keys of the BEP 44 test vectors.
ed25519-dalek = { workspace = true, features = ["hazmat", "digest"] }
