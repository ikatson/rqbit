[package]
name = "librqbit-tracker-comms"
version.workspace = true
edition = "2024"
description = "Common interface around various sha1 implementations used in rqbit torrent client."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-tracker-comms"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
# Install the ring rustls CryptoProvider as the process default so that
# reqwest clients built with the `rustls-no-provider` feature have a
# provider. Without this, `reqwest::Client::builder().build()` panics.
# Enabled via librqbit/rust-tls.
rust-tls-ring = ["dep:ring", "dep:rustls"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
futures.workspace = true
async-stream.workspace = true
buffers.workspace = true
librqbit-core.workspace = true
byteorder.workspace = true
serde.workspace = true
serde_derive.workspace = true
urlencoding.workspace = true
rand.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json"] }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
bencode.workspace = true
url.workspace = true
parking_lot.workspace = true
tokio-util.workspace = true
librqbit-dualstack-sockets.workspace = true
backon.workspace = true
itertools.workspace = true
serde_with.workspace = true
