[package]
name = "librqbit-tracker-comms"
version.workspace = true
edition = "2024"
description = "Common interface around various sha1 implementations used in rqbit torrent client."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-tracker-comms"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["sha1-crypto-hash"]
# The SHA-256 that names I2P destinations (see `librqbit_core::i2p`).
sha1-crypto-hash = ["librqbit-core/sha1-crypto-hash"]
sha1-ring = ["librqbit-core/sha1-ring"]

[dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
anyhow.workspace = true
futures.workspace = true
async-stream.workspace = true
buffers.workspace = true
librqbit-core.workspace = true
byteorder.workspace = true
serde.workspace = true
serde_derive.workspace = true
urlencoding.workspace = true
rand.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json"] }
bencode.workspace = true
url.workspace = true
parking_lot.workspace = true
tokio-util.workspace = true
librqbit-dualstack-sockets.workspace = true
backon.workspace = true
itertools.workspace = true
serde_with.workspace = true
httparse.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
# The fake SOCKS5 / SOCKS4 / HTTP proxies for the UDP tracker proxy tests.
librqbit-core = { workspace = true, features = ["test-util"] }
