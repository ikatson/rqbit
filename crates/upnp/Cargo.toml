[package]
name = "librqbit-upnp"
version.workspace = true
authors = ["Igor Katson <igor.katson@gmail.com>"]
edition = "2024"
description = "Library used by rqbit torrent client to lease port forwards on the router."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-upnp"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Install the ring rustls CryptoProvider as the process default so that
# reqwest clients built with the `rustls-no-provider` feature have a
# provider. Enabled via librqbit/rust-tls.
rust-tls-ring = ["dep:ring", "dep:rustls"]

[dependencies]
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_derive.workspace = true
tokio = { workspace = true, features = ["macros"] }
futures.workspace = true
url.workspace = true
network-interface.workspace = true
httparse.workspace = true
bstr.workspace = true
quick-xml = { workspace = true, features = ["serialize"] }
librqbit-dualstack-sockets.workspace = true
socket2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
